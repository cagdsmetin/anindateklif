<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/fonts/plus-jakarta-sans.css">
<link rel="stylesheet" href="lib/fonts/extra.css">
<link rel="stylesheet" href="lib/reel.css">
<script src="lib/reel-core.js"></script>
<script src="lib/shots.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Reel v3 — Hook: "Perdeci misin? Bunu izlemeden teklif yazma."
window.CFG = {
  actionEnd: 7.3,
  shots: [zipShot(0, 4.9), pdfShot(4.9, 7.3, .15, .47)],
  hookHTML: `
    <div style="position:absolute;left:84px;right:84px;top:130px">
      <div class="display h-xl brand" id="hk1"><span class="ln"><span>Perdeci misin?</span></span></div>
      <div class="display h-m" id="hk2" style="margin-top:22px"><span class="ln"><span>Bunu izlemeden</span></span><span class="ln"><span><span class="it" style="font-size:92px">teklif yazma.</span></span></span></div>
    </div>
    <div id="cap" style="position:absolute;left:84px;right:84px;top:150px">
      <div class="display h-m"><span class="ln"><span>Ölçüyü gir.</span></span><span class="ln"><span class="brand">Fiyat anında.</span></span><span class="ln"><span class="muted" style="font-size:52px;letter-spacing:-.02em">PDF + WhatsApp tek dokunuş.</span></span></div>
    </div>`,
  hook(t) {
    R.lines(R.$('hk1'), t, 0, { pre: .97, dur: .45, outAt: 3.3 });
    const p = R.E.out(R.prog(t, 0, .6));   // ilk karede hafif büyükten oturma
    R.$('hk1').style.transform = `scale(${1.06 - .06 * p})`; R.$('hk1').style.transformOrigin = '0 50%';
    R.lines(R.$('hk2'), t, .5, { stagger: .08, dur: .6, outAt: 3.36 });
    R.lines(R.$('cap'), t, 3.62, { stagger: .07, dur: .6, outAt: this.actionEnd - .32 });
  },
};
</script>
<script src="lib/reel-build.js"></script>
</body></html>
