<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/fonts/plus-jakarta-sans.css">
<link rel="stylesheet" href="lib/fonts/extra.css">
<link rel="stylesheet" href="lib/reel.css">
<script src="lib/reel-core.js"></script>
<script src="lib/shots.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Reel v2 — Hook: "Müşterin teklifi rakibinden önce alsın."
window.CFG = {
  actionEnd: 7.3,
  shots: [zipShot(0, 4.9), pdfShot(4.9, 7.3, .15, .47)],
  hookHTML: `
    <div style="position:absolute;left:84px;right:84px;top:140px">
      <div class="display h-l" id="hk"><span class="ln"><span>Müşterin teklifi</span></span><span class="ln"><span>rakibinden <span class="it brand" style="font-size:118px">önce</span></span></span><span class="ln"><span>alsın.</span></span></div>
    </div>
    <div id="cap" style="position:absolute;left:84px;right:84px;top:150px">
      <div class="display h-m"><span class="ln"><span>Ölçüyü gir.</span></span><span class="ln"><span class="brand">Fiyat anında.</span></span><span class="ln"><span class="muted" style="font-size:52px;letter-spacing:-.02em">PDF + WhatsApp tek dokunuş.</span></span></div>
    </div>`,
  hook(t) {
    R.lines(R.$('hk'), t, 0, { pre: .97, stagger: .05, dur: .5, outAt: 3.3 });
    R.lines(R.$('cap'), t, 3.62, { stagger: .07, dur: .6, outAt: this.actionEnd - .32 });
  },
};
</script>
<script src="lib/reel-build.js"></script>
</body></html>
