<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="lib/fonts/plus-jakarta-sans.css">
<link rel="stylesheet" href="lib/fonts/extra.css">
<link rel="stylesheet" href="lib/reel.css">
<script src="lib/reel-core.js"></script>
<script src="lib/shots.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
// Reel v1 — Hook: "Bu teklif 8 saniyede hazırlandı ⏱" + canlı sayaç.
// Kayıtlar 1x hızda oynar; sayaç 0. kareden başlar ve gerçek PDF ekrana
// geldiği karede durur (STOP < 8 sn). İki kayıt arka arkaya kurgulanmıştır.
const STOP = 6.8;
window.CFG = {
  actionEnd: 8.8,
  shots: [zipShot(0, 6.1), pdfShot(6.1, 8.8, 0, .62)],
  hookHTML: `
    <div style="position:absolute;left:84px;right:84px;top:120px">
      <div class="chip" id="tmChip" style="font-size:40px;padding:16px 34px 16px 26px">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg>
        <span class="timer" id="tm" style="font-size:44px">00:00.0</span>
        <span id="tmDone" style="font-size:34px;font-weight:800;display:none">PDF hazır</span>
      </div>
      <div class="display h-l" id="hk" style="margin-top:30px"><span class="ln"><span>Bu teklif</span></span><span class="ln"><span><span class="it brand" style="font-size:122px">8 saniyede</span> hazırlandı</span></span></div>
    </div>`,
  hook(t) {
    R.lines(R.$('hk'), t, 0, { pre: .97, stagger: .05, dur: .5, outAt: this.actionEnd - .32 });
    const e = Math.min(t, STOP), done = t >= STOP;
    const s = Math.floor(e), d = Math.floor((e - s) * 10 + 1e-6);
    R.$('tm').textContent = `00:${String(s).padStart(2, '0')}.${d}`;
    R.$('tmDone').style.display = done ? 'inline' : 'none';
    const chip = R.$('tmChip');
    const pop = R.E.out(R.prog(t, STOP, STOP + .4));
    chip.style.color = done ? '#06140D' : 'var(--warm)';
    chip.style.background = done ? 'var(--ok)' : 'rgba(245,181,68,.10)';
    chip.style.borderColor = done ? 'var(--ok)' : 'rgba(245,181,68,.45)';
    chip.style.transform = `scale(${done ? 1 + .1 * Math.sin(pop * Math.PI) : 1})`;
    chip.style.transformOrigin = '0 50%';
    chip.style.opacity = 1 - R.E.in(R.prog(t, this.actionEnd - .3, this.actionEnd));
  },
};
</script>
<script src="lib/reel-build.js"></script>
</body></html>
