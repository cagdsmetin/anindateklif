<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>QuoteDemo test</title>
<link href="fonts/plus-jakarta-sans.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#0B1020; }
  #phone { position:absolute; left:50%; top:50%; width:430px; height:932px;
    transform: translate(-50%,-50%) scale(2.02); transform-origin:50% 50%;
    border-radius:44px; overflow:hidden; box-shadow:0 0 0 6px #1f2937, 0 40px 120px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="phone"></div>
<script src="quote-demo.js"></script>
<script>
  QuoteDemo.mount(document.getElementById('phone'));
  window.DUR = 6;
  window.render = function (t) { QuoteDemo.render(t); };
</script>
</body>
</html>
